<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Classeur Pokémon</title>
  <meta name="theme-color" content="#ee1515">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="ball" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="#fff" stroke="#10132e" stroke-width="7"/>
      <path d="M4 50a46 46 0 0 1 92 0z" fill="#ee1515" stroke="#10132e" stroke-width="7" stroke-linejoin="round"/>
      <path d="M4 50h92" stroke="#10132e" stroke-width="8"/>
      <circle cx="50" cy="50" r="15" fill="#fff" stroke="#10132e" stroke-width="7"/>
      <circle cx="50" cy="50" r="6" fill="#d8dcff"/>
      <path d="M22 34a32 32 0 0 1 14-13" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none" opacity=".7"/>
    </symbol>
  </svg>

  <section id="login" class="login">
    <form id="login-form">
      <div class="logo big" role="img" aria-label="Classeur Pokémon">
        <svg class="logo-ball"><use href="#ball"/></svg>
        <div class="logo-text"><span class="logo-main">Pokémon</span><span class="logo-sub">Classeur</span></div>
      </div>
      <input id="email" type="email" placeholder="E-mail" autocomplete="username" required>
      <input id="password" type="password" placeholder="Mot de passe" autocomplete="current-password" required>
      <button type="submit">Se connecter</button>
      <p id="login-msg" class="msg"></p>
    </form>
  </section>

  <section id="app" hidden>
    <header class="top">
      <div class="row">
        <div class="logo" role="img" aria-label="Classeur Pokémon">
          <svg class="logo-ball"><use href="#ball"/></svg>
          <div class="logo-text"><span class="logo-main">Pokémon</span><span class="logo-sub">Classeur</span></div>
        </div>
        <div class="row-btn">
          <select id="cible-select" aria-label="Collection affichée" hidden></select>
          <button id="btn-scan" type="button" class="scan edit-only">📷 Scanner</button>
          <details id="menu" class="menu">
            <summary aria-label="Menu">☰</summary>
            <div class="menu-liste">
              <button id="btn-prix" type="button" class="ghost edit-only">💶 Actualiser les prix</button>
              <button id="btn-partage" type="button" class="ghost edit-only hors-partage">🔗 Partager ma collection</button>
              <button id="btn-export" type="button" class="ghost">⬇ Exporter (CSV)</button>
              <button id="logout" type="button" class="ghost hors-partage">Déconnexion</button>
            </div>
          </details>
        </div>
      </div>
      <p id="bandeau" class="lecture-banner" hidden></p>
      <nav id="onglets" class="onglets" aria-label="Sections"></nav>
      <p id="msg" class="msg"></p>
    </header>

    <main id="vue" class="vue"></main>
  </section>

  <!-- Détail d'une carte -->
  <dialog id="carte" class="modal">
    <div class="picker-head">
      <span></span>
      <button id="carte-close" type="button" class="ghost" aria-label="Fermer">✕</button>
    </div>
    <div id="carte-contenu" class="dash-contenu"></div>
  </dialog>

  <!-- Scanner -->
  <dialog id="scan" class="modal">
    <div class="picker-head">
      <h2>Scanner une carte</h2>
      <button id="scan-close" type="button" class="ghost" aria-label="Fermer">✕</button>
    </div>
    <p class="aide">Placez la carte <b>bien à plat, entière dans le cadre</b>, avec une lumière uniforme, puis appuyez sur « Lire la carte ».</p>
    <div id="scan-cadre" class="scan-cadre">
      <video id="scan-video" playsinline muted></video>
      <div id="scan-guide" class="scan-guide"></div>
    </div>
    <div class="scan-actions">
      <button id="scan-capture" type="button">📷 Lire la carte</button>
      <label class="bouton-fichier">🖼 Photo / image
        <input id="scan-fichier" type="file" accept="image/*" hidden>
      </label>
    </div>
    <p id="scan-info" class="msg"></p>
    <details class="scan-manuel">
      <summary>Corriger ou saisir à la main</summary>
      <form id="scan-manuel" class="row tools">
        <input id="scan-nom" type="text" list="noms-pokemon" placeholder="Nom de la carte" autocomplete="off">
        <input id="scan-num" type="text" placeholder="N° (ex. 018/091)" autocomplete="off">
        <input id="scan-ext" type="text" placeholder="Code extension (ex. PAF)" autocomplete="off">
        <button type="submit">Rechercher</button>
      </form>
    </details>
    <div id="scan-resultat" class="grille"></div>
  </dialog>

  <!-- Partage -->
  <dialog id="partage" class="modal petit">
    <div class="picker-head">
      <h2>Partager ma collection</h2>
      <button id="partage-close" type="button" class="ghost" aria-label="Fermer">✕</button>
    </div>
    <div id="partage-contenu" class="dash-contenu"></div>
  </dialog>

  <!-- Classeur : choix de la carte d'un Pokémon -->
  <dialog id="picker" class="modal">
    <div class="picker-head">
      <h2 id="picker-titre">Cartes</h2>
      <div class="picker-actions">
        <button id="picker-clear" type="button" class="ghost">Retirer la carte</button>
        <button id="picker-close" type="button" class="ghost" aria-label="Fermer">✕</button>
      </div>
    </div>
    <p id="picker-info" class="msg"></p>
    <div id="picker-grille" class="grille"></div>
  </dialog>

  <datalist id="noms-pokemon"></datalist>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
